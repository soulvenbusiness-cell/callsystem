<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CallDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // apply saved language and theme before first paint
  (function(){ try {
    var l = localStorage.getItem("calls.lang") || "en", t = localStorage.getItem("calls.theme") || "light";
    var h = document.documentElement; h.lang = l; h.dir = l === "ar" ? "rtl" : "ltr"; h.setAttribute("data-theme", t);
  } catch(e){} })();
</script>
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --soft:#F7F8FA; --soft2:#EFF1F4; --hover:#FAFBFC; --ink:#0E1726; --ink2:#344054; --muted:#667085; --line:#E6E8EC;
  --brand:#0B7A5F; --brand-dk:#086049; --brand-soft:#E4F3EE; --brand-tint:#F4FBF8;
  --new:#0B7A5F; --new-soft:#E4F3EE; --inc:#C2410C; --inc-soft:#FDEEE4; --fu:#4F46E5; --fu-soft:#EDECFD;
  --warn:#B45309; --warn-soft:#FEF3DC; --bad:#B42318; --bad-soft:#FDECEA; --bad-line:#F3C7C2; --wa:#179848; --wa-soft:#E3F6EA;
  --grid:#EEF0F3; --axis:#98A2B3; --empty:#C4CAD3; --overlay:rgba(14,23,38,.45);
  --note-ink:#6B3A06; --bad-ink:#7A1A12; --alert-ink:#2B2596;
  --shadow:0 1px 2px rgba(14,23,38,.05); --shadow-lg:0 24px 60px rgba(14,23,38,.18);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0B0F14; --card:#11161D; --soft:#161C24; --soft2:#1E2630; --hover:#151B23; --ink:#E7EBF0; --ink2:#C3CBD6; --muted:#8B96A5; --line:#232C37;
  --brand:#16A07C; --brand-dk:#5FD3AE; --brand-soft:rgba(22,160,124,.16); --brand-tint:rgba(22,160,124,.08);
  --new:#34C79E; --new-soft:rgba(52,199,158,.14); --inc:#F0894F; --inc-soft:rgba(240,137,79,.14); --fu:#8F8AFF; --fu-soft:rgba(143,138,255,.15);
  --warn:#F2B34B; --warn-soft:rgba(242,179,75,.13); --bad:#F2766E; --bad-soft:rgba(242,118,110,.13); --bad-line:rgba(242,118,110,.35); --wa:#3CC476; --wa-soft:rgba(60,196,118,.13);
  --grid:#1F2731; --axis:#6B7684; --empty:#3A4552; --overlay:rgba(0,0,0,.6);
  --note-ink:#F6D59A; --bad-ink:#F9B8B2; --alert-ink:#C9C6FF;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 24px 60px rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0F14; --card:#11161D; --soft:#161C24; --soft2:#1E2630; --hover:#151B23; --ink:#E7EBF0; --ink2:#C3CBD6; --muted:#8B96A5; --line:#232C37;
  --brand:#16A07C; --brand-dk:#5FD3AE; --brand-soft:rgba(22,160,124,.16); --brand-tint:rgba(22,160,124,.08);
  --new:#34C79E; --new-soft:rgba(52,199,158,.14); --inc:#F0894F; --inc-soft:rgba(240,137,79,.14); --fu:#8F8AFF; --fu-soft:rgba(143,138,255,.15);
  --warn:#F2B34B; --warn-soft:rgba(242,179,75,.13); --bad:#F2766E; --bad-soft:rgba(242,118,110,.13); --bad-line:rgba(242,118,110,.35); --wa:#3CC476; --wa-soft:rgba(60,196,118,.13);
  --grid:#1F2731; --axis:#6B7684; --empty:#3A4552; --overlay:rgba(0,0,0,.6);
  --note-ink:#F6D59A; --bad-ink:#F9B8B2; --alert-ink:#C9C6FF;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 24px 60px rgba(0,0,0,.55); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
[lang="ar"] body{font-family:"IBM Plex Sans Arabic","Manrope",system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #8FB8FF;outline-offset:2px;border-radius:8px}
.hidden{display:none !important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.84rem}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-inline-end:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.12rem;letter-spacing:-.01em;padding:0 8px 18px;font-family:"Manrope",sans-serif}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center}
.logo .mk svg{width:18px;height:18px;fill:currentColor;stroke:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--ink2);font-weight:600;text-align:start}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-dk)}
.nav .cnt{margin-inline-start:auto;background:var(--brand);color:#fff;font-size:.72rem;padding:1px 8px;border-radius:99px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.prefs{display:flex;align-items:center;gap:8px}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px}
.me b{display:block;font-size:.9rem} .me span{font-size:.78rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--soft2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.84rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(14,23,38,.12)}
.seg.full{display:flex} .seg.full button{flex:1}
#langSeg button{min-width:40px;font-family:"Manrope","IBM Plex Sans Arabic",sans-serif}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:600;margin-inline-start:auto}
.live i{width:8px;height:8px;border-radius:50%;background:var(--empty)}
.live.on i{background:#22A06B;box-shadow:0 0 0 3px rgba(34,160,107,.2)}
main.page{padding:28px 36px 48px;max-width:1240px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
[lang="ar"] .ph h1{letter-spacing:0}
.ph p{margin:4px 0 0;color:var(--muted)}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:6;flex-direction:row;align-items:center;flex-wrap:wrap;padding:10px 14px;border-inline-end:0;border-bottom:1px solid var(--line);gap:8px}
  .logo{padding:0;font-size:1rem}
  .nav{flex-direction:row;overflow-x:auto;order:3;width:100%}
  .nav button{white-space:nowrap}
  .side .foot{margin:0;margin-inline-start:auto;flex-direction:row;align-items:center;border:0;padding:0;flex-wrap:wrap;justify-content:flex-end}
  .side .foot .live,.side .foot .me .av,.side .foot .me .who2{display:none}
  .side .foot .me{padding:0}
  main.page{padding:20px 16px 40px}
  .ph h1{font-size:1.35rem}
}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.card + .card{margin-top:18px}
.g3 > .card, .g2 > .card{margin-top:0}
.card h2{margin:0;font-size:1rem;font-weight:700}
.card .sub{margin:3px 0 14px;color:var(--muted);font-size:.86rem}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chead .sub{margin-bottom:0}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:1100px){.g3{grid-template-columns:1fr}}
@media (max-width:900px){.g2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(.92);background:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.wa{background:var(--wa-soft);border-color:transparent;color:var(--wa)}
.btn.wa:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:.84rem;border-radius:8px}
.btn.icon{padding:6px;width:34px;height:34px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
input[type=text],input[type=search],input[type=date],select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:120px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1 1 200px}
.auto{width:auto !important}
.note{border-radius:12px;padding:12px 14px;margin-bottom:18px;background:var(--warn-soft);color:var(--note-ink);font-weight:500}
.note.err{background:var(--bad-soft);color:var(--bad-ink)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi .top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-weight:600;font-size:.84rem}
.ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--soft2);color:var(--ink2);flex:none}
.kpi .v{font-size:1.85rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.hero{background:var(--brand);border-color:var(--brand);color:#fff}
.kpi.hero .top,.kpi.hero .s{color:rgba(255,255,255,.82)}
.kpi.hero .ic{background:rgba(255,255,255,.16);color:#fff}
.ic.new{background:var(--new-soft);color:var(--new)} .ic.inc{background:var(--inc-soft);color:var(--inc)} .ic.fu{background:var(--fu-soft);color:var(--fu)}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:.76rem;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-new{background:var(--new-soft);color:var(--new)} .t-inc{background:var(--inc-soft);color:var(--inc)} .t-fu{background:var(--fu-soft);color:var(--fu)}
.s-grey{background:var(--soft2);color:var(--muted)} .s-ok{background:var(--brand-soft);color:var(--brand-dk)}
.s-warn{background:var(--warn-soft);color:var(--warn)} .s-bad{background:var(--bad-soft);color:var(--bad)} .s-blue{background:var(--fu-soft);color:var(--fu)}

/* ---------- type picker ---------- */
.tp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tp button{display:flex;gap:12px;align-items:flex-start;text-align:start;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer}
.tp button b{display:block;font-weight:700}
.tp button span.d{font-size:.82rem;color:var(--muted)}
.tp button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);box-shadow:0 0 0 3px var(--brand-soft)}
.tp .ic{width:34px;height:34px}
@media (max-width:560px){.tp{grid-template-columns:1fr}}

/* ---------- team ---------- */
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0;padding-top:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none;color:#fff;font-family:"Manrope","IBM Plex Sans Arabic",sans-serif}
.person .info{flex:1;min-width:0}
.person .info b{display:block;font-weight:700}
.person .info span{display:block;font-size:.8rem;color:var(--muted)}
.badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft2);color:var(--muted)}
.badge.ok{background:var(--brand-soft);color:var(--brand-dk)}
details.acc{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
details.acc summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .chev{margin-inline-start:auto;transition:transform .15s}
details.acc[open] summary .chev{transform:rotate(180deg)}
.fld{display:block;font-size:.82rem;font-weight:700;margin:12px 0 5px}
.acc textarea{min-height:80px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin:0 -20px;padding:0 20px}
table.t{width:100%;border-collapse:separate;border-spacing:0;min-width:680px}
.t th{text-align:start;font-weight:700;font-size:.76rem;color:var(--muted);background:var(--soft);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t th:first-child{border-start-start-radius:10px} .t th:last-child{border-start-end-radius:10px}
.t td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--hover)}
.who b{display:block;font-weight:700;white-space:nowrap}
.who span{display:block;font-size:.8rem;color:var(--muted);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-n{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink2);direction:ltr;unicode-bidi:isolate}
.when{font-size:.8rem;color:var(--muted);white-space:nowrap}
.t select{width:auto;padding:5px 8px;font-size:.84rem}
.t input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (min-width:761px){ td.c-ac .acts{flex-wrap:nowrap} }
.amt{width:120px !important;padding:6px 8px !important;direction:ltr;text-align:right}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
.empty svg{width:56px;height:56px;margin-bottom:6px;stroke-width:1.2;color:var(--empty)}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:2px}
.bulk{display:flex;align-items:center;gap:10px;background:var(--bad-soft);color:var(--bad-ink);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-weight:600}
.bulk .push{margin-inline-start:auto}
.meter{display:flex;align-items:center;gap:8px}
.meter .bar{flex:1;height:6px;border-radius:99px;background:var(--soft2);overflow:hidden;min-width:70px}
.meter .bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
@media (max-width:760px){
  .tw.cards{overflow:visible;margin:0;padding:0}
  .cards table.t{min-width:0}
  .cards .t thead{display:none}
  .cards .t, .cards .t tbody{display:block}
  .cards .t td.who{grid-column:1;grid-row:1;min-width:0}
  .cards .t tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
  .cards .t tr:last-child{border-bottom:0}
  .cards .t td{display:block;padding:0;border:0;background:none !important}
  .cards .t td.c-ph{grid-column:1;grid-row:2;justify-self:start}
  .cards .t td.c-ty{grid-column:2;grid-row:1;justify-self:end}
  .cards .t td.c-st{grid-column:2;grid-row:2;justify-self:end}
  .cards .t td.c-val{grid-column:1;grid-row:3;font-weight:700}
  .cards .t td.c-pcs{grid-column:2;grid-row:3;justify-self:end;color:var(--muted)}
  .cards .t td.c-na{display:none}
  .cards .t td.c-ac{grid-column:1 / -1;margin-top:6px}
  .cards .acts{justify-content:flex-start}
  .cards .acts .btn{flex:1}
}

/* ---------- agent ---------- */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--ink2);font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tabs .n{font-size:.75rem;background:var(--soft2);color:var(--ink2);border-radius:99px;padding:0 7px}
.tabs button[aria-selected="true"] .n{background:rgba(127,127,127,.25);color:inherit}
.alert{display:flex;align-items:center;gap:12px;background:var(--fu-soft);color:var(--alert-ink);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-weight:700}
.alert .btn{margin-inline-start:auto}
@media (prefers-reduced-motion:no-preference){.alert{animation:pop .35s ease-out} @keyframes pop{from{transform:translateY(-6px);opacity:0}}}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pick button{display:flex;align-items:center;gap:10px;padding:14px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:start}
.pick button:hover{border-color:var(--brand);background:var(--brand-tint)}

/* ---------- statistics ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters label{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted);font-weight:600}
.chart{width:100%;height:auto;display:block;direction:ltr}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--ink2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.tc .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.tc .hd h3{margin:0;font-size:.98rem;font-weight:700}
.tc .body{display:flex;gap:16px;align-items:center}
.donut{width:118px;height:118px;flex:none;direction:ltr}
.lg{flex:1;display:flex;flex-direction:column;gap:6px;font-size:.84rem;min-width:0}
.lg div{display:flex;align-items:center;gap:8px}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}
.lg b{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.foot-stat{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--soft);display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.86rem;color:var(--ink2);font-weight:600}
.foot-stat b{font-size:1.25rem;font-weight:800;color:var(--ink)}

/* ---------- dialogs ---------- */
.back{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:480px;max-height:calc(100% - 20px);overflow:auto;padding:22px;box-shadow:var(--shadow-lg)}
@media (max-width:560px){.back{align-items:flex-end;padding:0}.modal{border-radius:18px 18px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal h3{margin:6px 0 0;font-size:1.2rem;font-weight:800}
.modal .big{font-size:1.55rem;font-weight:800;letter-spacing:.02em;margin:2px 0 10px;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;unicode-bidi:isolate}
[dir="rtl"] .modal .big{text-align:right}
.hint{display:flex;gap:10px;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:14px;color:var(--ink2)}
.hint svg{color:var(--brand);margin-top:2px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.res button{border:1.5px solid var(--line);background:var(--card);padding:10px;border-radius:10px;cursor:pointer;font-weight:600}
.res button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-dk);box-shadow:0 0 0 3px var(--brand-soft)}
.modal textarea{min-height:70px}
.mf{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mf .btn{flex:1}
.x{border:0;background:var(--soft2);color:var(--ink);width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}

input[type=email],input[type=password]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--soft)}
.lcard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:28px}
.lcard .logo{padding:0 0 20px}
.lcard h1{margin:0;font-size:1.35rem;font-weight:800}
.lcard p.sub{margin:4px 0 18px;color:var(--muted)}
.lcard .btn.primary{width:100%;margin-top:16px;padding:11px}
.lcard .prefs{margin-top:18px;justify-content:space-between}
.ferr{color:var(--bad);font-weight:600;font-size:.86rem;margin:10px 0 0}
.boot{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.me{flex-wrap:wrap}
.me .who2{flex:1;min-width:0}
.me .who2 b,.me .who2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.addform .full{grid-column:1 / -1}
@media (max-width:560px){.addform{grid-template-columns:1fr}}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.qchips button{border:1.5px solid var(--line);background:var(--card);padding:6px 12px;border-radius:99px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--ink)}
.qchips button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-dk)}
.res.two button{padding:14px;font-size:1rem}
.qrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:.9rem}
.qrow .bar{height:8px;border-radius:99px;background:var(--soft2);overflow:hidden}
.qrow .bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.qrow b{font-variant-numeric:tabular-nums}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rbox{background:var(--soft);border-radius:12px;padding:12px 14px}
.rbox span{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.rbox b{display:block;font-size:1.5rem;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.rbox small{color:var(--muted);font-size:.78rem}
.person .em{font-size:.78rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}

  function parseLines(text){
    const out = [];
    text.split(/\r?\n/).forEach(line => {
      const parts = line.split(/[,\t;،]/).map(s => s.trim()).filter(Boolean);
      if (!parts.length) return;
      const i = parts.findIndex(p => /^\+?[\d\s\-()]{7,}$/.test(p) && cleanPhone(p).replace("+","").length >= 7);
      if (i === -1) return;
      const rest = parts.filter((_,j) => j !== i);
      out.push({ phone: cleanPhone(parts[i]), name: rest[0] || "", note: rest.slice(1).join(" - ") });
    });
    return out;
  }

  function subscribe(){

      .on("postgres_changes", {event:"*", schema:"public", table:"profiles"}, () => refetch("profiles"))
      .on("postgres_changes", {event:"*", schema:"public", table:"settings"}, () => refetch("settings"))

      const status = error && error.context && error.context.status;
      if (status === 404) continue;          // no function with this name, try the next one
      fnName = name; break;
    }
    if (error){
      let msg = "";
      try { const j = await error.context.json(); msg = j && j.error; } catch(e){}
      if (!msg) throw new Error("func");
      const err = new Error(msg); err.code = msg; throw err;

    return data;

  async function addNumbers(text){
    const target = $("assignSelect").value, msg = $("addMsg");
    if (!target){ toast(t("add_agent_first")); return; }
    const parsed = parseLines(text);
    if (!parsed.length){ msg.textContent = t("no_numbers"); msg.classList.remove("hidden"); return; }
    const type = S.addType;
    const open = new Set(S.calls.filter(x => typeOf(x) === type && !FINAL.includes(x.status)).map(x => x.phone));
    const seen = new Set(), fresh = []; let dup = 0;
    parsed.forEach(p => { if (open.has(p.phone) || seen.has(p.phone)) { dup++; return; } seen.add(p.phone); fresh.push(p); });
    const rows = [], tm = now();
    fresh.forEach((p, i) => {
      const agent_id = target === "__split" ? null : target;     // null = the database splits evenly
      const base = {phone:p.phone, name:p.name, note:p.note, agent_id, status:"pending", created_at:tm + i, updated_at:tm};
      if (type === "purchased"){
        const pid = uuid(), fid = uuid();
        rows.push(Object.assign({}, base, {id:pid, type:"purchased", followup_id:fid}));
        rows.push(Object.assign({}, base, {id:fid, type:"followup", parent_id:pid, due_at: tm + FOLLOWUP_DAYS*DAY}));
      } else rows.push(Object.assign({}, base, {id:uuid(), type:"checkout"}));
    });
    const btn = $("addNumbersBtn"); btn.disabled = true; btn.textContent = t("adding", fmt(fresh.length), fmt(fresh.length));
    let ok = true;
    for (let i = 0; i < rows.length && ok; i += 500){
      const { error } = await S.sb.from("calls").insert(rows.slice(i, i + 500));
      if (error){ ok = false; writeErr(error); }
    }
    btn.disabled = false; btn.textContent = t("add_btn");
    if (!ok) return;
    $("numbersInput").value = "";
    let split = "";
    if (target === "__split"){
      try {
        await loadCalls();
        const ids = new Set(rows.filter(r => r.type !== "followup").map(r => r.id)), per = {};
        S.calls.forEach(c => { if (ids.has(c.id)) per[c.agentId] = (per[c.agentId] || 0) + 1; });
        split = t("split_result", Object.entries(per).map(([id, n]) => `${agentName(id) || "—"} ${fmt(n)}`).join(LANG === "ar" ? "، " : ", "));
        render();
      } catch(e){}
    }
    msg.textContent = t("added", fmt(fresh.length)) + split + (type === "purchased" && fresh.length ? t("fb_sched", dateL(tm + FOLLOWUP_DAYS*DAY,{weekday:"long", month:"short", day:"numeric"})) : "") + (dup ? t("dups", fmt(dup)) : "");
    msg.classList.remove("hidden");
    refetch("calls");
  }

  function crunch(list, from, to){
    const out = {total:0, customers:0, amount:0, orders:[], days:{}, answered:0, reached:0, toReach:0, q:{}, wa:0};
    Object.keys(TYPES).forEach(k => out[k] = {calls:0, customers:0, res:{}});
    list.forEach(x => {
      const all = attemptsIn(x, from, to); if (!all.length) return;
      const e = all.filter(l => !l.auto);              // real calls (Shopify updates are not calls)
      const k = typeOf(x), last = all[all.length-1].s, b = out[k];
      b.calls += e.length; b.customers++; b.res[last] = (b.res[last]||0) + 1;
      out.total += e.length; out.customers++;
      e.forEach(l => { const d = dayKey(l.t); out.days[d] = out.days[d] || {purchased:0, followup:0, checkout:0}; out.days[d][k]++; });
      const firstAns = e.findIndex(l => l.s !== "no_answer");
      out.answered += e.filter(l => l.s !== "no_answer").length;
      if (firstAns >= 0){ out.reached++; out.toReach += firstAns + 1; }

  function dayChart(d, from, to){
    let start = from;

    const days = []; for (let x = start; x <= to && days.length < 92; x += DAY) days.push(dayKey(x));
    if (days.length > 60) days.splice(0, days.length - 60);
    const vals = days.map(k => d.days[k] || {purchased:0, followup:0, checkout:0});
    const tot = vals.map(v => v.purchased + v.followup + v.checkout);
    if (!tot.reduce((a,b) => a + b, 0)) return `<div class="empty">${ico("chart")}<b>${esc(t("chart_empty"))}</b>${esc(t("chart_empty_s"))}</div>`;
    const max = Math.max(4, ...tot), step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max / step) * step;
    const W = 900, H = 230, L = 36, B = 26, T = 10, cw = (W - L) / days.length, bw = Math.max(3, Math.min(34, cw * .62));
    const y = (v) => H - B - (v / nice) * (H - B - T);
    let g = "";

    const every = Math.ceil(days.length / 10);
    days.forEach((k, i) => {
      const x = L + i * cw + (cw - bw) / 2; let acc = 0;
      [["purchased","var(--new)"],["followup","var(--fu)"],["checkout","var(--inc)"]].forEach(([ty,c]) => {
        const v = vals[i][ty]; if (!v) return;
        const y1 = y(acc + v), h = y(acc) - y1; acc += v;
        g += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(h,1)}" rx="${Math.min(4, bw/3)}" fill="${c}"><title>${esc(dateL(fromKey(k),{month:"short", day:"numeric"}))}: ${fmt(v)} ${esc(tyName(ty))}</title></rect>`;
      });
      if (i % every === 0 || days.length <= 10) g += `<text x="${x + bw/2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--axis)">${esc(dateL(fromKey(k), days.length <= 7 ? {weekday:"short"} : {month:"short", day:"numeric"}))}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("chart_title"))}" style="font-family:inherit">${g}</svg>`;
  }

    const at = retryFor(st, now()), el = $("retryNote");
    if (!at){ el.classList.add("hidden"); return; }
    el.textContent = st === "no_answer" ? t("retry_note", time(at)) : t("later_note", dateL(at, {weekday:"long", month:"short", day:"numeric"}));
    el.classList.remove("hidden");
  }
  async function saveResult(){
    const x = S.calls.find(c => c.id === S.modalId);
    if (!x || !S.draftStatus) return;
    const tm = now(), st = S.draftStatus, note = $("resultNote").value.trim();
    const retryAt = retryFor(st, tm);
    const entry = {s:st, n:note, t:tm};
    if (Q_STATUSES.includes(st)){
      const qs = [...document.querySelectorAll("[data-q][aria-pressed='true']")].map(b => b.dataset.q);
      const other = ($("qOther").value || "").trim(); if (other) qs.push(other);
      if (qs.length) entry.q = qs;
    }
    const patch = {status:st, result:note, calledAt:tm, updatedAt:tm, retryAt, attempts:(x.attempts||0)+1, log:[...(Array.isArray(x.log) ? x.log : []).slice(-19), entry]};
    const amt = SALE.includes(st) ? toNum($("amountIn").value) : 0; if (amt > 0) patch.amount = amt;
    $("saveResult").disabled = true;
    try {
      await upd(x.id, patch);
      S.seen.add(x.id + ":" + st + ":" + (retryAt || tm));
      if (x.followupId && (st === "wrong" || st === "cancelled")){
        const fu = S.calls.find(c => c.id === x.followupId && !FINAL.includes(c.status));
        if (fu){ try { await upd(fu.id, {status:"skipped", result: t(st === "wrong" ? "wrong_note" : "cancelled_note"), updatedAt:tm}); } catch(e){} }
      }
      closeModal();
      toast(st === "no_answer" ? t("saved_retry", time(retryAt)) : retryAt ? t("saved_later", when(retryAt)) : t("saved", stL(st)));
      refetch("calls");
    } catch(e){ writeErr(e); $("saveResult").disabled = false; }
  }
  function retryFor(st, tm){
    if (st === "no_answer") return tm + RETRY_HOURS*HOUR;
    if (st === "later") return tm + LATER_DAYS*DAY;
    if (st === "not_tried") return tm + NOT_TRIED_DAYS*DAY;
    return null;
  }
  async function markWa(id){ try { await upd(id, {waAt: now(), updatedAt: now()}); } catch(e){} }
  function checkNew(){
    if (!S.me || !S.loaded || isManager()) return;
    const fresh = mine().filter(actionable).filter(x => !S.seen.has(noticeKey(x)));
    fresh.forEach(x => S.seen.add(noticeKey(x)));
    if (!S.primed){ S.primed = true; return; }
    if (fresh.length){
      S.newCount += fresh.length;
      toast(t("new_toast", LANG === "en" ? fresh.length : fmt(fresh.length)));
      try { navigator.vibrate && navigator.vibrate([120,80,120]); } catch(e){}
    }
  }

  /* ================= ROOT ================= */
  function render(){
    if (!S.me) return;
    ["v_home","v_stats","v_calls","v_agent"].forEach(v => $(v).classList.add("hidden"));
    renderNav();
    if (isManager()){
      $("v_" + S.view).classList.remove("hidden");
      if (S.view === "home") renderHome(); else if (S.view === "stats") renderStats(); else renderCalls();
    } else { $("v_agent").classList.remove("hidden"); renderAgent(); }
  }
  function setLang(l){ LANG = l; store.set("calls.lang", l); applyStatic(); if (S.modalId){ openModal(S.modalId); } render(); }
  function setTheme(th){ THEME = th; store.set("calls.theme", th); applyStatic(); }

  document.addEventListener("click", (e) => {
    if (e.target === $("modalBack")){ closeModal(); return; }
    if (e.target === $("askBack")){ answer(false); return; }
    if (e.target === $("formBack")){ closeForm(null); return; }
    const b = e.target.closest("button, a[data-call], a[data-wa]"); if (!b) return;
    const ds = b.dataset;
    if (ds.call){ const id = ds.call; setTimeout(() => openModal(id), 700); return; }
    if (ds.wa){ markWa(ds.wa); return; }
    if (ds.lang){ setLang(ds.lang); return; }
    if (b.classList.contains("themeBtn")){ setTheme(THEME === "dark" ? "light" : "dark"); return; }
    if (ds.view){ if (ds.view !== "agent"){ S.view = ds.view; store.set("calls.view", S.view); } render(); window.scrollTo({top:0}); return; }
    if (ds.type){ S.addType = ds.type; document.querySelectorAll("[data-type]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); return; }
    if (ds.preset){ setPreset(ds.preset); renderStats(); return; }
    if (ds.delAgent){ removeAgent(ds.delAgent); return; }
    if (ds.pw){ resetAgentPw(ds.pw); return; }
    if (ds.rename){ renameAgent(ds.rename); return; }
    if (ds.delCall){ deleteCall(ds.delCall); return; }
    if (ds.tab){ S.tab = ds.tab; renderAgent(); return; }
    if (ds.open){ openModal(ds.open); return; }
    if (ds.ans){
      S.answered = ds.ans;
      document.querySelectorAll("[data-ans]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      document.querySelectorAll("[data-result]").forEach(x => x.setAttribute("aria-pressed", "false"));
      $("outBox").classList.toggle("hidden", ds.ans !== "yes");
      $("qBox").classList.add("hidden"); $("amountBox").classList.add("hidden");
      if (ds.ans === "no"){ S.draftStatus = "no_answer"; showRetry("no_answer"); $("saveResult").disabled = false; }
      else { S.draftStatus = null; $("retryNote").classList.add("hidden"); $("saveResult").disabled = true; }
      return;
    }
    if (ds.result){
      S.draftStatus = ds.result;
      document.querySelectorAll("[data-result]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      $("saveResult").disabled = false;
      showRetry(ds.result);
      $("amountBox").classList.toggle("hidden", !SALE.includes(ds.result));
      $("qBox").classList.toggle("hidden", !Q_STATUSES.includes(ds.result));
      return;
    }
    if (ds.q !== undefined && b.closest(".qchips")){ b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); return; }
    switch (b.id){
      case "pwBtn": changePassword(); break;
      case "outBtn": signOut(); break;
      case "addAgentBtn": addAgent(); break;
      case "addNumbersBtn": addNumbers($("numbersInput").value); break;
      case "saveTpl": saveTemplates(); break;
      case "saveQ": saveQuestions(); break;
      case "saveResult": saveResult(); break;
      case "mClose": closeModal(); break;
      case "newDismiss": S.newCount = 0; renderAgent(); break;
      case "cleanBtn": cleanOld(); break;
      case "exportBtn": exportCsv(); break;
      case "exportOrders": exportOrders(); break;
      case "resetBtn": resetAll(); break;
      case "bulkDel": bulkDelete(); break;
      case "bulkClear": S.sel.clear(); renderCalls(); break;
      case "askYes": answer(true); break;
      case "askNo": answer(false); break;
      case "fdNo": closeForm(null); break;
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && askResolve){ answer(false); return; }
    if (e.key === "Escape" && formResolve){ closeForm(null); return; }
    if (e.key === "Escape" && S.modalId) closeModal();
  });
  document.addEventListener("input", (e) => { if (e.target.id === "fSearch"){ S.filter.q = e.target.value; renderCalls(); } });
  document.addEventListener("change", (e) => {
    const x = e.target;
    if (x.id === "fAgent"){ S.filter.agent = x.value; renderCalls(); }
    if (x.id === "fType"){ S.filter.type = x.value; renderCalls(); }
    if (x.id === "fStatus"){ S.filter.status = x.value; renderCalls(); }
    if (x.dataset.reassign && x.value) reassign(x.dataset.reassign, x.value);
    if (x.dataset.amount) setAmount(x.dataset.amount, x.value);
    if (x.dataset.sel){ x.checked ? S.sel.add(x.dataset.sel) : S.sel.delete(x.dataset.sel); renderBulk(); }
    if (x.id === "selAll"){ const on = x.checked; S.visible.forEach(id => on ? S.sel.add(id) : S.sel.delete(id)); renderCalls(); }
    if (x.id === "sAgent"){ S.statAgent = x.value; renderStats(); }
    if ((x.id === "dFrom" || x.id === "dTo") && x.value){
      const f = $("dFrom").value ? fromKey($("dFrom").value) : 0, to = $("dTo").value ? fromKey($("dTo").value, true) : sod() + DAY - 1;
      if (f > to){ toast(t("e_dates")); return; }
      S.preset = "custom"; S.range = {from:f, to}; renderStats();
    }
    if (x.id === "csvFile" && x.files && x.files[0]){
      const r = new FileReader();
      r.onload = () => { $("numbersInput").value = String(r.result || ""); toast(t("file_loaded")); };
      r.readAsText(x.files[0]); x.value = "";
    }
  });
  $("loginForm").addEventListener("submit", signIn);

  // time-based changes (follow-ups coming due, 2-hour retries) + a safety refetch in case a live event was missed
  setInterval(() => { if (!S.me) return; checkNew(); if (!S.modalId && !askResolve && !formResolve) render(); }, 60000);
  setInterval(() => { if (S.me) refetch("calls"); }, 5 * 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.me) refetch("calls"); });

  /* ================= BOOT ================= */
  applyStatic();
  (async function boot(){
    if (!window.supabase || !window.supabase.createClient){ showOnly("login"); $("lErr").textContent = t("net_err"); $("lErr").classList.remove("hidden"); return; }
    S.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession:true, autoRefreshToken:true } });
    S.sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT" && S.me){ S.me = null; showOnly("login"); } });
    const { data } = await S.sb.auth.getSession();
    if (data && data.session) await startSession(data.session); else showOnly("login");
  })();
})();

</script>
</body>
</html>
